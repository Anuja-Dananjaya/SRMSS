<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Schedule Management</title>
  <link rel="stylesheet" href="../css/scheduleManagement.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <header>
    <h1>Schedule Management</h1>
  </header>

  <!-- Create Schedule Form -->
  <section class="create-schedule">
    <h2>Create New Schedule</h2>
    <form id="createScheduleForm">
      <div class="form-row">
        <label for="driverId">Driver ID</label>
        <input type="number" id="driverId" name="driverId" required />
      </div>
      <div class="form-row">
        <label for="routeId">Route ID</label>
        <input type="number" id="routeId" name="routeId" required />
      </div>
      <div class="form-row">
        <label for="vehicleId">Vehicle ID</label>
        <input type="number" id="vehicleId" name="vehicleId" required />
      </div>
      <div class="form-row">
        <label for="scheduleDate">Date</label>
        <input type="date" id="scheduleDate" name="scheduleDate" required />
      </div>
      <div class="form-row">
        <label for="departureTime">Departure Time</label>
        <input type="time" id="departureTime" name="departureTime" />
      </div>
      <div class="form-row">
        <label for="arrivalTime">Arrival Time</label>
        <input type="time" id="arrivalTime" name="arrivalTime" />
      </div>
      <button type="submit" class="btn-primary">Create Schedule</button>
    </form>
  </section>

  <!-- Schedule Table -->
  <section class="schedule-table">
    <h2>Existing Schedules</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Driver</th>
          <th>Route</th>
          <th>Vehicle</th>
          <th>Date</th>
          <th>Departure</th>
          <th>Arrival</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="schedulesBody"></tbody>
    </table>
  </section>

  <script src="/js/scheduleManagement.js"></script>
  <script src="/js/roleNav.js"></script>
</body>
</html>
